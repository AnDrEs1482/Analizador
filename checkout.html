<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago · LuaShop</title><link rel="stylesheet" href="styles.css"></head><body><div id="header"></div><section class="section"><div class="container checkout-grid"><form class="auth-card" id="payForm"><span class="eyebrow">Checkout Lua</span><h1>Finaliza tu ritual.</h1><div class="form-group"><label>Nombre completo</label><input required></div><div class="form-group"><label>Dirección de entrega</label><input required></div><div class="form-group"><label>Correo</label><input type="email" required></div><h3 class="serif">Método de pago</h3><div class="pay-options"><label class="pay-option active"><input type="radio" checked name="pay"> Tarjeta</label><label class="pay-option"><input type="radio" name="pay"> Otro</label></div><div class="form-group"><label>Número de tarjeta</label><input inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" required></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="form-group"><label>Vencimiento</label><input placeholder="MM/AA" required></div><div class="form-group"><label>CVV</label><input inputmode="numeric" maxlength="4" placeholder="123" required></div></div><div class="notice">Demo: este formulario no procesa ni almacena pagos reales.</div><button class="btn btn-primary" style="width:100%;margin-top:15px">Pagar ahora</button></form><aside class="summary" id="paymentArea"><h2 class="serif">Resumen</h2><p style="color:var(--muted)">Total estimado</p><div class="summary-line summary-total"><span>Total</span><span id="checkoutTotal">$0.00</span></div><a href="carrito.html" class="btn btn-outline" style="width:100%;margin-top:10px">Volver al carrito</a></aside></div></section><div id="footer"></div><script src="app.js"></script><script>setupShared();initCheckout()</script></body></html>
