<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuenta · LuaShop</title><link rel="stylesheet" href="styles.css"></head><body><div id="header"></div><main class="auth"><form class="auth-card" id="authForm"><span class="eyebrow">Mi cuenta Lua</span><h1>Bienvenido a tu ritual.</h1><p style="color:var(--muted);line-height:1.6">Este prototipo guarda tu nombre localmente en el navegador. No hay servidor real conectado.</p><div class="form-group"><label>Nombre</label><input id="authName" required placeholder="Tu nombre"></div><div class="form-group"><label>Correo</label><input type="email" required placeholder="tu@email.com"></div><div class="form-group"><label>Contraseña</label><input type="password" required placeholder="••••••••"></div><button class="btn btn-primary" style="width:100%">Crear cuenta / Iniciar sesión</button></form></main><div id="footer"></div><div class="toast"></div><script src="app.js"></script><script>setupShared();initAuth()</script></body></html>
